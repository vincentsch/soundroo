name: Soundroo checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The recorded instruments (about 4 GB) come from the samples release; renders in the tests read them.
      - run: node bin/soundroo.js samples --all
      - run: npm test
      - run: node bin/soundroo.js doctor
